name: HE3 Windows Release x86 Build

# R7.4: normal main pushes are already gated by a successful local VS2022
# Release|x86 build. Keep cloud build only as an explicit manual fallback.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x86:
    name: VS2022 Release x86
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout build sources only
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /R7.1-Build/HE3_RopeCalibration_R7.1_Minimal.sln
            /R7.1-Build/CalibrationV3Analytic/
            /R7.1-Build/RopeEncoderCalibrationV3/
            /R7.1-Build/eigen3/
            /R7.1-Build/websocketpp-master/
            /R7.1-Build/asio-1.12.2/include/

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x86

      - name: Show checkout and toolchain
        shell: pwsh
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "MSBuild:"
          Get-Command msbuild | Format-List Source,Version
          msbuild -version

      - name: Verify required build inputs
        shell: pwsh
        run: |
          $required = @(
            "R7.1-Build/HE3_RopeCalibration_R7.1_Minimal.sln",
            "R7.1-Build/CalibrationV3Analytic/CalibrationV3Analytic.vcxproj",
            "R7.1-Build/RopeEncoderCalibrationV3/RopeEncoderCalibration.vcxproj",
            "R7.1-Build/eigen3",
            "R7.1-Build/websocketpp-master",
            "R7.1-Build/asio-1.12.2/include"
          )

          foreach ($item in $required) {
            if (-not (Test-Path -LiteralPath $item)) {
              throw "Required build input not found: $item"
            }
            Write-Host "OK: $item"
          }

          if (Test-Path -LiteralPath "R7.1-Build/asio-1.12.2/doc") {
            throw "Sparse checkout unexpectedly included asio documentation."
          }

      - name: Normalize legacy GBK sources to UTF-8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          try {
            [System.Text.Encoding]::RegisterProvider(
              [System.Text.CodePagesEncodingProvider]::Instance
            )
          } catch {
            Write-Host "CodePagesEncodingProvider registration not required on this runner."
          }

          $strictUtf8 = [System.Text.UTF8Encoding]::new($false, $true)
          $utf8Bom = [System.Text.UTF8Encoding]::new($true)
          $gbk = [System.Text.Encoding]::GetEncoding(
            936,
            [System.Text.EncoderFallback]::ExceptionFallback,
            [System.Text.DecoderFallback]::ExceptionFallback
          )

          $roots = @(
            "R7.1-Build/RopeEncoderCalibrationV3",
            "R7.1-Build/CalibrationV3Analytic"
          )
          # Only normalize files parsed by the C/C++ compiler.
          # Resource files (.rc/.rc2) are intentionally left untouched:
          # the legacy HE3 .rc already carries '#pragma code_page(936)' and
          # rc.exe has its own resource-file encoding rules.
          $textExtensions = @(
            ".c", ".cc", ".cpp", ".cxx",
            ".h", ".hh", ".hpp", ".inl"
          )

          $converted = @()

          foreach ($root in $roots) {
            Get-ChildItem -LiteralPath $root -Recurse -File | ForEach-Object {
              $file = $_
              if ($textExtensions -notcontains $file.Extension.ToLowerInvariant()) {
                return
              }

              $bytes = [System.IO.File]::ReadAllBytes($file.FullName)

              try {
                $null = $strictUtf8.GetString($bytes)
                return
              } catch {
                # Not valid UTF-8. The legacy HE3/V1 sources were authored
                # on Chinese Windows and are CP936/GBK.
              }

              try {
                $text = $gbk.GetString($bytes)
              } catch {
                throw "Source is neither valid UTF-8 nor valid CP936/GBK: $($file.FullName)"
              }

              [System.IO.File]::WriteAllText($file.FullName, $text, $utf8Bom)
              $converted += $file.FullName
            }
          }

          Write-Host "Converted legacy CP936/GBK files to UTF-8 BOM:"
          if ($converted.Count -eq 0) {
            Write-Host "(none)"
          } else {
            $converted | ForEach-Object { Write-Host "  $_" }
          }

          # These three files caused the first cloud build failure.
          # After normalization they must all decode as strict UTF-8.
          $mustBeUtf8 = @(
            "R7.1-Build/RopeEncoderCalibrationV3/RoughCalibrationDlg.cpp",
            "R7.1-Build/RopeEncoderCalibrationV3/QKMLinkComm.cpp",
            "R7.1-Build/RopeEncoderCalibrationV3/FileOperation.cpp"
          )

          foreach ($item in $mustBeUtf8) {
            if (-not (Test-Path -LiteralPath $item)) {
              throw "Expected source file not found: $item"
            }
            $bytes = [System.IO.File]::ReadAllBytes($item)
            try {
              $null = $strictUtf8.GetString($bytes)
              Write-Host "UTF-8 OK: $item"
            } catch {
              throw "UTF-8 normalization failed: $item"
            }
          }

      - name: Build Release x86
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $solution = "R7.1-Build/HE3_RopeCalibration_R7.1_Minimal.sln"
          $logDir = "ci-logs"
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null

          # Source files are normalized to UTF-8 above. Keep the execution
          # character set at CP936 to match the original Chinese-Windows V1 build
          # for narrow string literals while parsing source as UTF-8.
          $env:CL = "/source-charset:utf-8 /execution-charset:.936 $env:CL"
          Write-Host "CL=$env:CL"

          & msbuild $solution `
            /m `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x86 `
            /verbosity:minimal `
            /nologo `
            /fl `
            /flp:"logfile=$logDir/msbuild.log;verbosity=diagnostic" `
            /bl:"$logDir/msbuild.binlog"

          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            throw "MSBuild failed with exit code $exitCode"
          }

      - name: Verify build outputs
        shell: pwsh
        run: |
          $exe = "R7.1-Build/bin/Win32/Release/HE3_RopeCalibration_V3_Tool.exe"
          $dll = "R7.1-Build/bin/Win32/Release/CalibrationV3Analytic.dll"

          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Missing EXE: $exe"
          }

          if (-not (Test-Path -LiteralPath $dll)) {
            throw "Missing DLL: $dll"
          }

          Get-Item $exe, $dll | Select-Object FullName, Length, LastWriteTime

      - name: Upload EXE and DLL
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: HE3-RopeCalibration-Windows-Release-x86-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            R7.1-Build/bin/Win32/Release/HE3_RopeCalibration_V3_Tool.exe
            R7.1-Build/bin/Win32/Release/CalibrationV3Analytic.dll

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: HE3-build-logs-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            ci-logs/msbuild.log
            ci-logs/msbuild.binlog
